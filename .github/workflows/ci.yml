name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and audit transitive dependencies
        run: >-
          dotnet restore H2Pdf.slnx
          -p:NuGetAudit=true -p:NuGetAuditMode=all
          '-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905'

      - name: Build
        run: dotnet build H2Pdf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test H2Pdf.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/H2Pdf/H2Pdf.csproj --configuration Release --no-build --output ./artifacts
