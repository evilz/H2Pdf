name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RazorPdf.slnx

      - name: Build
        run: dotnet build RazorPdf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RazorPdf.slnx --configuration Release --no-build

      - name: Compute package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}-alpha.${GITHUB_RUN_ID}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Pack
        run: dotnet pack src/RazorPdf/RazorPdf.csproj --configuration Release --no-build --output ./artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: RazorPdfKit-nuget
          path: artifacts/*.nupkg
