name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore H2Pdf.slnx

      - name: Build
        run: dotnet build H2Pdf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test H2Pdf.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/H2Pdf/H2Pdf.csproj --configuration Release --no-build --output ./artifacts
